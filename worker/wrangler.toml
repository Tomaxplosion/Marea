name = "marea-youtube-api"
main = "src/index.mjs"
compatibility_date = "2025-03-01"

[vars]
DAILY_SEARCH_LIMIT = "80"

[[ratelimits]]
name = "SEARCH_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 6, period = 60 }

[[durable_objects.bindings]]
name = "SEARCH_BUDGET"
class_name = "SearchBudget"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SearchBudget"]
